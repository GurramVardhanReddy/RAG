services:
  # --- Vector Database (Qdrant) ---
  qdrant:
    image: qdrant/qdrant:v1.19.2   # pinned: the BM25 arm needs the IDF modifier (>= 1.10)
    container_name: explainable-rag-qdrant
    ports:
      - "127.0.0.1:6333:6333"   # REST API, local only
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

  # --- Backend API ---
  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    container_name: explainable-rag-backend
    ports:
      - "127.0.0.1:8000:8000"   # local only; public traffic goes through the frontend on port 80
    env_file:
      - .env
    environment:
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
    volumes:
      - ./data/uploads:/app/data/uploads
      - hf_models:/models        # embedding/reranker models survive container rebuilds
    depends_on:
      - qdrant
    restart: unless-stopped

  # --- Frontend (React build served by nginx; proxies /api to the backend) ---
  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    container_name: explainable-rag-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  qdrant_data:
  hf_models:
