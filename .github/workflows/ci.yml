name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies (CPU torch)
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt ruff

      - name: Lint (syntax errors and undefined names)
        run: ruff check backend scripts --select E9,F63,F7,F82

      - name: Tests (in-memory Qdrant, no model downloads)
        run: pytest backend/tests -q

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -f docker/Dockerfile.backend -t explainable-rag-backend .

      - name: Build frontend image
        run: docker build -f docker/Dockerfile.frontend -t explainable-rag-frontend .
